name: Production

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        env:
          CMS_URL: https://cms.marketeconomy.org
          NEXT_PUBLIC_CMS_URL: https://cms.marketeconomy.org
          NEXT_PUBLIC_MEDIA_URL: https://marketeconomy.org/media
        run: pnpm build

  deploy:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: build
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    environment: production

    steps:
      - name: Configure SSH
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT || '6262' }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER || 'marketeco' }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${PROD_SSH_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${PROD_SSH_PORT}" "${PROD_SSH_HOST}" >> ~/.ssh/known_hosts

      - name: Deploy from main
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT || '6262' }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER || 'marketeco' }}
        run: |
          set -euo pipefail
          ssh -p "${PROD_SSH_PORT}" "${PROD_SSH_USER}@${PROD_SSH_HOST}" \
            'bash -lc '"'"'
            set -euo pipefail
            if [ ! -d /srv/apps/marketeconomy/repo/.git ]; then
              echo "Missing /srv/apps/marketeconomy/repo. Bootstrap the server source checkout before deploying."
              exit 1
            fi
            cd /srv/apps/marketeconomy/repo
            command -v pnpm
            git fetch origin main
            git checkout main
            git pull --ff-only origin main
            DEPLOY_BRANCH=main pnpm deploy:production
            '"'"

      - name: Check out repository for smoke test
        uses: actions/checkout@v4

      - name: Set up pnpm for smoke test
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Set up Node.js for smoke test
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies for smoke test
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm -C apps/cms exec playwright install chromium

      - name: Smoke production from GitHub runner
        run: pnpm smoke:production

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-smoke-results
          path: smoke-results/
          if-no-files-found: ignore

      - name: Smoke production from server
        continue-on-error: true
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT || '6262' }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER || 'marketeco' }}
        run: |
          set -euo pipefail
          ssh -p "${PROD_SSH_PORT}" "${PROD_SSH_USER}@${PROD_SSH_HOST}" \
            'cd /srv/apps/marketeconomy/current && pnpm smoke:production'
